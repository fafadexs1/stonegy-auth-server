<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo - Lançar Atualizações</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0b12;
      --card: #141422;
      --border: #242438;
      --accent: #00e676;
      --text: #f0f0f8;
      --text-muted: #8c8ca8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 30px 6%; min-height: 100vh; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
    .title { font-size: 1.5rem; font-weight: 800; }
    .btn-back { background: #1a1a2e; border: 1px solid var(--border); color: #fff; padding: 8px 14px; border-radius: 8px; text-decoration: none; font-size: 0.85rem; font-weight: 600; }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 850px) { .grid { grid-template-columns: 1fr; } }
    
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 24px; }
    .card-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 18px; color: var(--accent); }
    
    .form-group { margin-bottom: 16px; }
    .label { display: block; font-size: 0.85rem; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
    .input, .textarea { width: 100%; background: #0c0c16; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 0.95rem; color: #fff; outline: none; }
    .input:focus, .textarea:focus { border-color: var(--accent); }
    .textarea { height: 110px; resize: vertical; font-family: inherit; }
    .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }

    .btn-submit { width: 100%; background: var(--accent); color: #09090f; border: none; padding: 12px; border-radius: 8px; font-weight: 800; font-size: 1rem; cursor: pointer; transition: filter 0.2s; }
    .btn-submit:hover { filter: brightness(1.1); }
    
    .status-msg { margin-top: 14px; padding: 10px; border-radius: 6px; font-size: 0.9rem; font-weight: 600; display: none; }
    .status-msg.success { background: rgba(0,230,118,0.15); color: var(--accent); border: 1px solid rgba(0,230,118,0.3); }
    .status-msg.error { background: rgba(255,82,82,0.15); color: #ff5252; border: 1px solid rgba(255,82,82,0.3); }

    .release-item { background: #0e0e18; border: 1px solid var(--border); padding: 12px; border-radius: 8px; margin-bottom: 10px; }
    .rel-top { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 4px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">⚙️ Painel de Lançamento de Atualizações</div>
    <a href="/" class="btn-back">⬅️ Voltar ao Site</a>
  </div>

  <div class="grid">
    <!-- Formulário de Publicação -->
    <div class="card">
      <div class="card-title">🚀 Publicar Nova Versão da Extensão</div>
      <form id="releaseForm">
        <div class="form-group">
          <label class="label">Senha do Administrador</label>
          <input type="password" id="adminPass" class="input" placeholder="Senha do Admin" required />
        </div>
        <div class="form-group">
          <label class="label">Número da Versão (Sem 'v')</label>
          <input type="text" id="version" class="input" placeholder="Ex: 3.4.0" required />
        </div>
        <div class="form-group">
          <label class="label">Título do Release</label>
          <input type="text" id="title" class="input" placeholder="Ex: Gráfico de Ondas de DPS & Novos Alertas" required />
        </div>
        <div class="form-group">
          <label class="label">O que mudou? (Changelog)</label>
          <textarea id="changelog" class="textarea" placeholder="• Adicionado sintetizador de som para monstros raros&#10;• Corrigido cálculo de dano instantâneo&#10;• Integração com authtibia.klyraai.com.br" required></textarea>
        </div>
        <div class="form-group">
          <label class="label">Link para Download do ZIP</label>
          <input type="text" id="downloadUrl" class="input" value="/download/latest" required />
        </div>
        <div class="form-group checkbox-row">
          <input type="checkbox" id="forceUpdate" style="cursor: pointer;" />
          <label for="forceUpdate" style="cursor: pointer;">Forçar atualização (Bloqueia versões antigas até atualizar)</label>
        </div>
        <button type="submit" class="btn-submit" id="btnSubmit">📢 Publicar para Todas as Extensões</button>
        <div class="status-msg" id="statusMsg"></div>
      </form>
    </div>

    <!-- Lista de Versões no Banco -->
    <div class="card">
      <div class="card-title">📜 Versões Publicadas no PostgreSQL</div>
      <div id="releasesList">Carregando...</div>
    </div>
  </div>

  <script>
    async function loadReleasesList() {
      const container = document.getElementById('releasesList');
      try {
        const res = await fetch('/api/version/history');
        const data = await res.json();
        if (data.success && data.releases && data.releases.length > 0) {
          container.innerHTML = '';
          data.releases.forEach(r => {
            const div = document.createElement('div');
            div.className = 'release-item';
            div.innerHTML = `
              <div class="rel-top">
                <span style="color: var(--accent);">v${r.version} - ${r.title}</span>
                <span style="color: var(--text-muted); font-size: 11px;">${new Date(r.created_at).toLocaleDateString('pt-BR')}</span>
              </div>
              <div style="font-size: 12px; color: #aaa; white-space: pre-line;">${r.changelog}</div>
            `;
            container.appendChild(div);
          });
        } else {
          container.innerHTML = '<div style="color: #888;">Nenhuma versão publicada ainda.</div>';
        }
      } catch (err) {
        container.innerHTML = '<div style="color: #ff5252;">Erro ao carregar versões.</div>';
      }
    }

    document.getElementById('releaseForm').onsubmit = async (e) => {
      e.preventDefault();
      const statusMsg = document.getElementById('statusMsg');
      const btn = document.getElementById('btnSubmit');

      btn.disabled = true;
      btn.textContent = 'Gravando no PostgreSQL...';
      statusMsg.style.display = 'none';

      const payload = {
        adminPass: document.getElementById('adminPass').value,
        version: document.getElementById('version').value.trim().replace(/^v/, ''),
        title: document.getElementById('title').value.trim(),
        changelog: document.getElementById('changelog').value.trim(),
        downloadUrl: document.getElementById('downloadUrl').value.trim(),
        forceUpdate: document.getElementById('forceUpdate').checked
      };

      try {
        const res = await fetch('/api/version/publish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.success) {
          statusMsg.className = 'status-msg success';
          statusMsg.textContent = '✅ Versão ' + payload.version + ' publicada com sucesso! As extensões dos usuários já receberão o aviso de atualização.';
          statusMsg.style.display = 'block';
          loadReleasesList();
        } else {
          statusMsg.className = 'status-msg error';
          statusMsg.textContent = '❌ ' + (data.message || 'Erro ao publicar versão.');
          statusMsg.style.display = 'block';
        }
      } catch (err) {
        statusMsg.className = 'status-msg error';
        statusMsg.textContent = '❌ Erro de conexão com o servidor.';
        statusMsg.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = '📢 Publicar para Todas as Extensões';
      }
    };

    loadReleasesList();
  </script>
</body>
</html>
